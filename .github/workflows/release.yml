name: Release

# Tag a commit to cut a build:
#   git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1
# Anything with a hyphen in the version (alpha/beta/rc) is published as a
# GitHub pre-release, so a test build cannot be mistaken for a stable one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x86_64)
            target: x86_64-pc-windows-msvc
            binary: elusive.exe
            archive: elusive-windows-x86_64.zip
          - os: macos-latest
            label: macOS (Apple silicon)
            target: aarch64-apple-darwin
            binary: elusive
            archive: elusive-macos-aarch64.tar.gz
          # Cross-compiled from the Apple-silicon runner rather than built on a
          # `macos-13` one: those runners are retired and the job simply queues
          # forever, blocking the whole release.
          - os: macos-latest
            label: macOS (Intel, cross-compiled)
            target: x86_64-apple-darwin
            binary: elusive
            archive: elusive-macos-x86_64.tar.gz
          - os: ubuntu-latest
            label: Linux (x86_64)
            target: x86_64-unknown-linux-gnu
            binary: elusive
            archive: elusive-linux-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p elusive-app

      # `assets/` ships alongside the binary: the app reads fonts and its icon
      # from there at startup and degrades gracefully when they are absent.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" staging/
          Copy-Item -Recurse assets staging/assets
          Copy-Item README.md staging/
          Compress-Archive -Path staging/* -DestinationPath "${{ matrix.archive }}"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" staging/
          cp -r assets staging/assets
          cp README.md staging/
          tar -czf "${{ matrix.archive }}" -C staging .

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # `always()` so one platform failing does not withhold the builds that did
    # succeed — a broken macOS leg should not keep a working .exe off the release.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Fail if nothing was built
        run: |
          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "::error::no platform produced a binary"
            exit 1
          fi

      - name: List artifacts
        run: ls -lR artifacts

      - name: Create or update the release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          # A hyphenated version (v0.1.0-alpha.1) marks a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            **EluSive ${{ github.ref_name }}** — an early build for real-world testing.

            Windows: download `elusive-windows-x86_64.zip`, unzip it anywhere, and run
            `elusive.exe`. Keep the `assets/` folder next to the binary. The build is
            unsigned, so SmartScreen will warn on first launch — choose *More info →
            Run anyway*.

            Open a `.ngcAnalysis` or `.ngcMethodruns` archive (or drag one onto the
            window). Your source file is never modified; analysis is written to a
            `<run>.elusive.json` sidecar beside it.

            Please report what the **Overview → Review required** panel says for your
            runs — those warnings flag the format details still to be confirmed
            against real files.
