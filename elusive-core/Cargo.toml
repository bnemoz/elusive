[package]
name = "elusive-core"
description = "Parsing, model, integration and calibration for Bio-Rad NGC / ChromLab runs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# This crate is deliberately UI-free: no egui, no eframe, no windowing.
# See CLAUDE.md "Engineering constraints".
[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
quick-xml.workspace = true
base64.workspace = true
encoding_rs.workspace = true

[dev-dependencies]
# The parser only reads archives; the tests need to *write* one to exercise it.
zip = { workspace = true, features = ["deflate"] }
base64.workspace = true
