[workspace]
resolver = "2"
members = ["elusive-core", "elusive-app"]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bnemoz/EluSive"

[workspace.dependencies]
elusive-core = { path = "elusive-core" }

# Core (UI-free) dependencies.
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
base64 = "0.23"
encoding_rs = "0.8"

# App-only dependencies.
eframe = "0.35"
egui = "0.35"
egui_plot = "0.36"
rfd = "0.17"
anyhow = "1.0"
# PNG only. The default feature set drags in every codec `image` supports, and
# this project ships a hand-built Windows binary for an offline machine.
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
