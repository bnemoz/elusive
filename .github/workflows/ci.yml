name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # eframe needs GTK (for the file dialog) and X11/Wayland headers on Linux.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

  core-is-ui-free:
    name: elusive-core has no UI dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The core/UI split is the project's load-bearing constraint (CLAUDE.md).
      # A transitive egui dependency would make the parser untestable headless,
      # so it fails the build rather than being caught in review.
      - name: Assert no egui/eframe in the core dependency tree
        run: |
          cargo tree -p elusive-core --edges normal --prefix none > tree.txt
          if grep -Eq '^(egui|eframe|egui_plot|winit|wgpu|glow)\b' tree.txt; then
            echo "::error::elusive-core must not depend on a UI toolkit"
            grep -E '^(egui|eframe|egui_plot|winit|wgpu|glow)\b' tree.txt
            exit 1
          fi
          echo "elusive-core is UI-free."
